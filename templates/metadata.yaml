# .writing/metadata.yaml — scientific-integrity state.
# Populated during outlining. Verified at claim-verification (presence check only;
# user owns truthfulness of each field).

# Selects the section standards and evidence contract the drafting skill applies.
# `systems` turns on the structured analysis/artifact evidence contract and the
# Results-versus-Discussion boundary; leave it unset for a general CS paper.
writing_profile: systems

authors: []
# - name: Sipeng Xie
#   affil: Institution name
#   orcid: 0000-0000-0000-0000
#   coi: none

# Only when the target venue asks for it. CS, systems, and ML venues generally
# do not; leave registry as none for those.
preregistration:
  registry: none   # OSF, or a venue-mandated registry for cross-disciplinary work
  url: TODO
  deviations: []
  # - {date: YYYY-MM-DD, description: "...", rationale: "..."}

data_availability:
  statement: TODO
  access: TODO     # open | restricted | on-request | none

code_availability:
  url: TODO
  license: TODO    # MIT | Apache-2.0 | GPL-3.0 | none

# Venue-mandated reporting checklist. CS, systems, and ML venues generally have
# none; the biomedical ones (CONSORT, STROBE, PRISMA, ARRIVE) apply only to
# cross-disciplinary submissions that require them.
reporting_guideline: none

# Zotero integration (optional). When enabled, claim-verification queries
# your Zotero library first (authoritative) and falls back to online
# DOI resolution only when Zotero has no matching item. API key lives in .env.
zotero:
  enabled: false
  collection_key: ""            # per-paper collection (see ZOTERO_DEFAULT_COLLECTION fallback)
  auto_push_new_citations: true # drafting dedupes by DOI; writes new items to collection_key
